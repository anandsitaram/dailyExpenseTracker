name: Build

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  quality:
    name: Validation (typecheck + format)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

  web:
    name: Web build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Web build
        run: npm run web:build

  mobile:
    name: Mobile lint + Android build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Mobile lint
        working-directory: apps/mobile
        run: npm run lint

      - name: Make Gradle executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Android build
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
