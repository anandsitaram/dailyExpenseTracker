name: Generate Android Build

on:
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --ignore-scripts


      - name: Compute version info
        id: version
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Android Release
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PVERSION_NAME=${{ steps.version.outputs.name }} \
            -PVERSION_CODE=${{ steps.version.outputs.code }}

      - name: Locate APK
        run: |
          find apps/mobile/android/app/build/outputs -type f -name "*.apk" -print

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             "dist/daily-expense-tracker-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-expense-tracker-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: dist/*.apk
          retention-days: 2
