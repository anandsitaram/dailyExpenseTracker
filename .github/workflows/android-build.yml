name: Android Build

on:
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify React Native dependencies
        run: |
          echo "Node version:"
          node --version

          echo "npm version:"
          npm --version

          echo "Babel runtime:"
          npm ls @babel/runtime

          echo "Babel runtime resolution:"
          node -e "console.log(require.resolve('@babel/runtime/helpers/interopRequireDefault'))"

      - name: Make gradlew executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/daily-expense-tracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-expense-tracker.apk
          path: apps/mobile/android/app/build/outputs/apk/release/daily-expense-tracker.apk
          retention-days: 3
