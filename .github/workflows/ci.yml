name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test

  web-e2e:
    name: Web (Playwright E2E)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  mobile-unit:
    name: Mobile (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run lint

  # Detox E2E (Android) needs a real emulator and a debug build, which is a heavier setup than
  # the jobs above - see TESTING.md for how to configure and enable this job once a Detox
  # config has been added and verified locally/on a self-hosted runner.
  # mobile-e2e:
  #   name: Mobile (Detox E2E - Android)
  #   runs-on: ubuntu-latest
  #   ...
