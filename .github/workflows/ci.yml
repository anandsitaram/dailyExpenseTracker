name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality (core + typecheck + format)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

  web:
    name: Web (build + unit tests)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Web build
        run: npm run web:build

      - name: Web tests
        run: npm run web:test

  web-e2e:
    name: Web (Playwright E2E)
    runs-on: ubuntu-latest
    needs: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  mobile:
    name: Mobile (unit + lint + Android build)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Mobile tests
        working-directory: apps/mobile
        run: npm test

      - name: Mobile lint
        working-directory: apps/mobile
        run: npm run lint

      - name: Make Gradle executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Android build
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
